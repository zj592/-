# 用法：
#   docker compose up -d --build   启动
#   docker compose down            停止（数据保留）
#   docker compose down -v         停止并清空数据
name: campus-lost-found

services:
  mysql:
    image: mysql:8.0
    container_name: lf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      # 应用连这个账号，不用 root：官方镜像的 root 只允许 localhost 登录
      MYSQL_DATABASE: lost_found
      MYSQL_USER: ${MYSQL_USER:-lf_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lf_pass_2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      # 本机 3306 一般被占了，所以走 3307
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据卷为空时执行，改完 init.sql 要用 down -v 重新灌
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - lf-net

  # ---------------- 后端应用 ----------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campus-lost-found:1.0.0
    container_name: lf-app
    restart: unless-stopped
    depends_on:
      mysql:
        # 等 MySQL 能连上再起，否则应用启动时连库会失败
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lost_found?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-lf_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-lf_pass_2026}
      APP_UPLOAD_PATH: /app/uploads
      APP_UPLOAD_URL_PREFIX: ${UPLOAD_URL_PREFIX:-http://localhost:8080/uploads/}
      # 启动时灌演示数据；微信走 mock；订阅消息关着
      APP_INIT_DATA: "true"
      APP_WX_MOCK: "true"
      APP_SUBSCRIBE_ENABLED: "false"
      # 容器里不用逐条打 MyBatis SQL
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai -Dmybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl"
      TZ: Asia/Shanghai
    ports:
      # 8080 被占时用 APP_PORT=8090
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    networks:
      - lf-net

volumes:
  mysql-data:
  uploads:

networks:
  lf-net:
    driver: bridge
