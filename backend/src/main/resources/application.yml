server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-lost-found
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: "1234"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 关闭 Spring Boot 默认的静态资源缓存，方便前端调接口时看实时数据
  web:
    resources:
      cache:
        period: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档：http://localhost:8080/doc.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  jwt:
    # 至少 32 位，正式部署请替换
    secret: campus-lost-found-jwt-secret-key-2026-change-me-in-production
    # token 有效期，单位秒（这里 7 天）
    expire: 604800
  upload:
    # 图片上传的本地存储目录，相对于启动目录
    path: ./uploads
    # 返回给前端的可访问前缀
    url-prefix: http://localhost:8080/uploads/
  # 启动时若数据表为空，自动写入演示数据
  init-data: true
  # 微信小程序登录
  wx:
    # 留空则进入 mock 模式：用小程序端持久化的 deviceId 当 openid，
    # 开发者工具 / 测试号没有真实 appid 也能跑通整条登录链路
    appid: ""
    secret: ""
    # 配了 appid/secret 之后也可以打开它做本地联调
    mock: true
    jscode2session-url: https://api.weixin.qq.com/sns/jscode2session
  # 订阅消息：在微信公众平台申请模板后把 id 填进来，并把 enabled 改成 true
  subscribe:
    enabled: false
    template:
      claim-result: ""
      item-audit: ""
      claim-received: ""
