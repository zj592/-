name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------- 1. 编译打包 ----------------
  build:
    name: 编译打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # pom 不在根目录，不写这行缓存不生效
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Maven 打包
        working-directory: backend
        run: mvn -B -DskipTests clean package

      - name: 上传 jar 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/*.jar
          retention-days: 3

  # ---------------- 2. 起真库跑接口端到端测试 ----------------
  integration-test:
    name: 接口端到端测试
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          # 不加这个只会建 root@localhost，从 runner 连进来会 Access denied
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: lost_found
          MYSQL_USER: lf_app
          MYSQL_PASSWORD: lf_pass_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot123456 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 下载上一步的 jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/target

      - name: 初始化数据库
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot123456 < db/init.sql
          echo "已建表："
          mysql -h127.0.0.1 -P3306 -uroot -proot123456 -e "show tables" lost_found

      - name: 启动后端服务
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/lost_found?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: lf_app
          SPRING_DATASOURCE_PASSWORD: lf_pass_2026
        run: |
          nohup java -jar backend/target/lost-found-backend-1.0.0.jar > app.log 2>&1 &
          echo "等待服务就绪..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/items > /dev/null 2>&1; then
              echo "服务已就绪（第 ${i} 次探测）"
              curl -s http://localhost:8080/api/items | head -c 200
              exit 0
            fi
            sleep 2
          done
          echo "服务 120 秒内未就绪"
          tail -50 app.log
          exit 1

      - name: 跑接口测试
        run: |
          set -e
          curl -sf http://localhost:8080/api/items > /dev/null || { echo "服务不可用"; tail -50 app.log; exit 1; }
          python3 tests/api_smoke_test.py
          python3 tests/claim_flow_test.py
          python3 tests/wx_notify_test.py
          python3 tests/upload_test.py

      - name: 失败时输出后端日志
        if: failure()
        run: tail -200 app.log
